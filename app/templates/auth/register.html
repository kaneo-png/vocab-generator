{% extends "base.html" %}

{% block title %}無料登録 | 単語帳ジェネレーター{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>無料登録</h1>
    <p class="auth-description">無料プランで月3回まで単語帳を生成できます。</p>
    <form method="POST" class="auth-form">
        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">パスワード（8文字以上）</label>
            <input type="password" id="password" name="password" required minlength="8">
        </div>
        <div class="form-group">
            <label for="confirm_password">パスワード（確認）</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-block">アカウントを作成</button>
    </form>
    <p class="auth-link">
        すでにアカウントをお持ちですか？ <a href="{{ url_for('auth.login') }}">ログイン</a>
    </p>
</div>
{% endblock %}
