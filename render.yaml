# Render Blueprint定義
# https://render.com で「New Blueprint」→ このファイルを指定すると
# Webサービス + PostgreSQL が自動で作成されます。

databases:
  - name: vocab-generator-db
    databaseName: vocab_generator
    user: vocab_generator
    plan: free
    ipAllowList: [] # 全アクセス許可（開発段階）

services:
  - type: web
    name: vocab-generator
    runtime: python
    pythonVersion: "3.12.3" # psycopg2-binary 2.9.9はPython 3.14非対応のため3.12を固定
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask db upgrade && gunicorn run:app --bind 0.0.0.0:${PORT:-8000}"
    healthCheckPath: /
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: vocab-generator-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false # Renderダッシュボードで手動設定
      - key: DEEPSEEK_BASE_URL
        value: "https://api.deepseek.com"
      - key: DEEPSEEK_MODEL
        value: "deepseek-chat"
      - key: DEEPSEEK_JSON_MODE
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: STRIPE_PRICE_AD_FREE
        sync: false
      - key: STRIPE_PRICE_PREMIUM
        sync: false
